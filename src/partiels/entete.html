  <div class="conteneur entete-barre">
    <a class="marque" href="index.html">
      <svg class="marque-signe" aria-hidden="true" focusable="false"><use href="#logo"/></svg>
      <span class="marque-textes"><span class="marque-nom">{{site.nom_debut}}<span class="marque-nom-fin">{{site.nom_fin}}</span></span><span class="marque-lieu">{{site.accroche}}</span></span>

      <ul>
